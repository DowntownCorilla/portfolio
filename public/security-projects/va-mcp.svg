    <path d="M430 331V349H1050V331" fill="#eff6ff"/>
    <text x="456" y="329" fill="#1d4ed8" font-size="16" font-weight="750">02 · CORE ENGINE</text>
    <text x="1024" y="329" fill="#64748b" font-size="13" text-anchor="end">MCP와 독립된 모듈형 분석 엔진</text>

