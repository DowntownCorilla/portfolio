<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">VA-MCP 아키텍처</title>
  <desc id="desc">AI-Native 개발 흐름의 기능 테스트 이후 MCP 보안점검을 추가하고, 엔드포인트 맥락에 맞는 OWASP Top 10 점검 도구만 선택해 실행하는 모듈형 구조</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
