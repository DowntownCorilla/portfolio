    <text x="235" y="443" fill="#64748b" font-size="14" text-anchor="middle">Cursor · Claude Desktop</text>
    <path d="M235 474V510" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

    <rect x="96" y="522" width="278" height="94" rx="14" fill="#eef2ff" stroke="#818cf8"/>
    <text x="235" y="557" fill="#3730a3" font-size="19" font-weight="750" text-anchor="middle">MCP Adapter</text>
    <text x="235" y="583" fill="#475569" font-size="14" text-anchor="middle">analyze_endpoint 호출</text>

    <text x="96" y="668" fill="#64748b" font-size="13" font-weight="700" letter-spacing="1">전달하는 엔드포인트 맥락</text>
