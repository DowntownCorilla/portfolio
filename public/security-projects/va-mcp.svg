      <rect x="96" y="687" width="126" height="38" rx="19"/><rect x="232" y="687" width="142" height="38" rx="19"/>
      <rect x="96" y="736" width="126" height="38" rx="19"/><rect x="232" y="736" width="142" height="38" rx="19"/>
      <rect x="96" y="785" width="278" height="38" rx="19"/>
    </g>
