    <text x="70" y="91" fill="#475569" font-size="18">AI-Native 개발 플로우에 OWASP Top 10 기반 API 보안점검을 연결</text>

    <g filter="url(#shadow)">
      <rect x="70" y="125" width="1460" height="126" rx="18" fill="#ffffff" stroke="#dbe4ee"/>
    </g>
    <text x="96" y="157" fill="#64748b" font-size="14" font-weight="700" letter-spacing="1.5">AI-NATIVE DEVELOPMENT FLOW</text>

    <g>
      <rect x="96" y="176" width="270" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <circle cx="123" cy="202" r="15" fill="#64748b"/>
      <text x="123" y="207" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1</text>
      <text x="148" y="208" fill="#1e293b" font-size="18" font-weight="700">기획·문서화</text>
      <path d="M376 202H414" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>

      <rect x="426" y="176" width="235" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <circle cx="453" cy="202" r="15" fill="#64748b"/>
      <text x="453" y="207" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2</text>
      <text x="478" y="208" fill="#1e293b" font-size="18" font-weight="700">구현</text>
      <path d="M671 202H709" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>

      <rect x="721" y="176" width="235" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <circle cx="748" cy="202" r="15" fill="#64748b"/>
      <text x="748" y="207" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3</text>
      <text x="773" y="208" fill="#1e293b" font-size="18" font-weight="700">기능 테스트</text>
      <path d="M966 202H1004" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

      <rect x="1016" y="168" width="488" height="68" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <circle cx="1048" cy="202" r="17" fill="#2563eb"/>
      <text x="1048" y="208" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">4</text>
      <text x="1078" y="196" fill="#1d4ed8" font-size="19" font-weight="750">MCP 보안점검 추가</text>
      <text x="1078" y="219" fill="#475569" font-size="14">엔드포인트 맥락에 맞춰 OWASP 점검 수행</text>
