      <text x="484" y="437" fill="#64748b" font-size="14">입력 파싱 · 정규화 · 검증 → 공통 데이터 구조</text>
      <path d="M740 460V488" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

