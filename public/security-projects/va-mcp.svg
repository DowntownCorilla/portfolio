      <path d="M740 578V606" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <rect x="456" y="618" width="568" height="98" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
      <rect x="456" y="618" width="8" height="98" rx="4" fill="#2563eb"/>
      <text x="484" y="648" fill="#1d4ed8" font-size="18" font-weight="750">ScenarioPlanner</text>
      <text x="484" y="674" fill="#334155" font-size="14">OWASP 후보와 필요한 도구만 선택</text>
      <text x="484" y="697" fill="#64748b" font-size="13">입력이 부족하면 실행 전 need_more_context 반환</text>
      <path d="M740 716V744" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <rect x="456" y="756" width="270" height="104" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="591" y="790" fill="#0f172a" font-size="17" font-weight="750" text-anchor="middle">ScenarioRunner</text>
      <text x="591" y="816" fill="#64748b" font-size="13" text-anchor="middle">OWASP 시나리오별 실행</text>
      <text x="591" y="838" fill="#64748b" font-size="13" text-anchor="middle">결과 집계</text>
      <path d="M726 808H754" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

      <rect x="766" y="756" width="258" height="104" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="895" y="790" fill="#0f172a" font-size="17" font-weight="750" text-anchor="middle">Orchestrator</text>
      <text x="895" y="816" fill="#64748b" font-size="13" text-anchor="middle">도구 실행 · 인증 컨텍스트</text>
      <text x="895" y="838" fill="#64748b" font-size="13" text-anchor="middle">결과 수집 · 실패 격리</text>
    </g>

    <path d="M1050 808H1094" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <rect x="1080" y="294" width="450" height="55" rx="18" fill="#ecfdf5"/>
    <path d="M1080 331V349H1530V331" fill="#ecfdf5"/>
    <text x="1106" y="329" fill="#047857" font-size="16" font-weight="750">03 · CONTEXT-AWARE EXECUTION</text>

    <text x="1106" y="390" fill="#0f172a" font-size="18" font-weight="750">모든 도구를 실행하지 않습니다</text>
    <text x="1106" y="416" fill="#64748b" font-size="14">엔드포인트의 특징과 맥락에 맞는 도구만 선택</text>

    <g>
      <rect x="1106" y="449" width="398" height="64" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <circle cx="1134" cy="481" r="13" fill="#f97316"/>
      <text x="1134" y="486" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">A</text>
      <text x="1160" y="475" fill="#9a3412" font-size="15" font-weight="750">로그인·토큰 API</text>
      <text x="1160" y="496" fill="#7c2d12" font-size="13">인증 · 세션 · JWT 점검</text>

      <rect x="1106" y="526" width="398" height="64" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
      <circle cx="1134" cy="558" r="13" fill="#7c3aed"/>
      <text x="1134" y="563" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">B</text>
      <text x="1160" y="552" fill="#5b21b6" font-size="15" font-weight="750">리소스 ID + 다중 권한</text>
      <text x="1160" y="573" fill="#5b21b6" font-size="13">IDOR · BOLA · BFLA · RBAC 점검</text>

      <rect x="1106" y="603" width="398" height="64" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
      <circle cx="1134" cy="635" r="13" fill="#0891b2"/>
      <text x="1134" y="640" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">C</text>
      <text x="1160" y="629" fill="#155e75" font-size="15" font-weight="750">사용자 입력이 있는 API</text>
      <text x="1160" y="650" fill="#155e75" font-size="13">SQLi · XSS · SSTI 등 Injection 점검</text>
    </g>

    <path d="M1305 667V703" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
    <rect x="1106" y="715" width="187" height="78" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1199" y="747" fill="#166534" font-size="16" font-weight="750" text-anchor="middle">Python Tools</text>
    <text x="1199" y="771" fill="#475569" font-size="13" text-anchor="middle">실제 HTTP 요청</text>
    <path d="M1293 754H1317" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
    <rect x="1329" y="715" width="175" height="78" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1416" y="747" fill="#9a3412" font-size="16" font-weight="750" text-anchor="middle">Target API</text>
    <text x="1416" y="771" fill="#475569" font-size="13" text-anchor="middle">제한된 점검 요청</text>

    <rect x="1106" y="824" width="398" height="60" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1305" y="849" fill="#0f172a" font-size="15" font-weight="750" text-anchor="middle">ScenarioResult → EndpointReport</text>
    <text x="1305" y="870" fill="#64748b" font-size="13" text-anchor="middle">MCP 응답 · Markdown · JSON 보고서</text>
    <path d="M1416 793V813H1305V824" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

    <text x="70" y="958" fill="#64748b" font-size="14">설계 기준: VA-MCP V3.1 및 현재 구현 코드 · 각 모듈의 책임을 분리해 독립적인 개선과 교체가 가능하도록 구성</text>
  </g>
</svg>
