<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Responsible vulnerability disclosure timeline</title>
  <desc id="desc">A vulnerability was reproduced safely, reported with remediation guidance, and later marked patched.</desc>
  <rect width="1280" height="720" fill="#050505"/>
  <g stroke="#c9a77c" fill="none" stroke-width="3">
    <rect x="70" y="80" width="1140" height="560" rx="8" opacity=".45"/>
    <path d="M150 355h980"/>
    <circle cx="180" cy="355" r="26" fill="#050505"/><circle cx="480" cy="355" r="26" fill="#050505"/><circle cx="780" cy="355" r="26" fill="#050505"/><circle cx="1080" cy="355" r="26" fill="#050505"/>
    <rect x="105" y="155" width="150" height="95" rx="5"/><rect x="405" y="465" width="150" height="95" rx="5"/><rect x="705" y="155" width="150" height="95" rx="5"/><rect x="1005" y="465" width="150" height="95" rx="5"/>
  </g>
  <g fill="#c9a77c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="640" y="55" font-size="22" letter-spacing="5">RESPONSIBLE DISCLOSURE</text>
    <text x="180" y="205" font-size="22">REPRODUCE</text><text x="480" y="515" font-size="22">ANALYZE</text><text x="780" y="205" font-size="22">REPORT</text><text x="1080" y="515" font-size="22">PATCHED</text>
    <text x="180" y="410" font-size="15" opacity=".7">SAFE BOUNDARY</text><text x="480" y="310" font-size="15" opacity=".7">SQL ERROR</text><text x="780" y="410" font-size="15" opacity=".7">KISA</text><text x="1080" y="310" font-size="15" opacity=".7">2026.08.27</text>
    <text x="640" y="615" font-size="16" opacity=".7">NO DATA EXTRACTION · NO AUTH BYPASS · REMEDIATION INCLUDED</text>
  </g>
</svg>
