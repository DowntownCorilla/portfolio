<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">원클릭 보안점검 SaaS 엔진 적용 결과</title>
  <desc id="desc">실제 커머스 프로젝트에서 SAST, SCA, DAST 엔진을 검증한 범위와 서로 다른 결과의 의미를 요약</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>.sans{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#0f172a}.subtitle{font-size:20px;font-weight:500;fill:#475569}.engine{font-size:30px;font-weight:900}.number{font-size:54px;font-weight:900;fill:#0f172a}.miniNumber{font-size:30px;font-weight:900;fill:#0f172a}.unit{font-size:18px;font-weight:700;fill:#64748b}.body{font-size:17px;font-weight:500;fill:#475569}.small{font-size:15px;font-weight:600;fill:#64748b}.label{font-size:15px;font-weight:800}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g class="sans">
    <text x="80" y="82" class="title">세 엔진을 같은 서비스에 적용해 서로 다른 관점으로 검증했습니다</text><text x="80" y="120" class="subtitle">실제 커머스 코드와 Staging 환경 기준 · 결과의 성격이 달라 단순 합산하지 않습니다</text>
    <g filter="url(#shadow)"><rect x="80" y="170" width="450" height="560" rx="26" fill="#fff"/><rect x="80" y="170" width="450" height="12" rx="6" fill="#2563eb"/></g>
    <text x="118" y="230" class="engine" fill="#1d4ed8">SAST</text><text x="118" y="265" class="body">소스코드 구조와 값 전달 경로 분석</text><text x="118" y="354" class="number">846</text><text x="248" y="354" class="unit">소스 파일</text><line x1="118" y1="390" x2="492" y2="390" stroke="#dbeafe" stroke-width="2"/><text x="118" y="446" class="number">31</text><text x="192" y="446" class="unit">코드 검토 후보</text>
    <g transform="translate(118 478)"><rect width="100" height="34" rx="17" fill="#fee2e2"/><text x="50" y="23" text-anchor="middle" class="label" fill="#b91c1c">High 10</text><rect x="112" width="112" height="34" rx="17" fill="#fef3c7"/><text x="168" y="23" text-anchor="middle" class="label" fill="#92400e">Medium 3</text><rect x="236" width="105" height="34" rx="17" fill="#e0f2fe"/><text x="288" y="23" text-anchor="middle" class="label" fill="#0369a1">Low 18</text></g>
    <rect x="118" y="552" width="374" height="132" rx="16" fill="#eff6ff"/><text x="140" y="588" class="body" font-weight="800">결과 해석</text><text x="140" y="620" class="small">Pattern과 Taint 분석으로 찾은 검토 후보이며,</text><text x="140" y="648" class="small">코드 맥락과 실제 실행 여부를 추가 확인합니다.</text>

    <g filter="url(#shadow)"><rect x="575" y="170" width="450" height="560" rx="26" fill="#fff"/><rect x="575" y="170" width="450" height="12" rx="6" fill="#16a34a"/></g>
    <text x="613" y="230" class="engine" fill="#15803d">SCA</text><text x="613" y="265" class="body">의존성 구성과 알려진 취약점 매칭</text><text x="613" y="354" class="number">428</text><text x="743" y="354" class="unit">의존성</text><line x1="613" y1="390" x2="987" y2="390" stroke="#dcfce7" stroke-width="2"/><text x="613" y="446" class="number">132</text><text x="721" y="446" class="unit">버전 매칭</text>
    <g transform="translate(613 478)"><rect width="92" height="34" rx="17" fill="#7f1d1d"/><text x="46" y="23" text-anchor="middle" class="label" fill="#fff">Critical 15</text><rect x="104" width="95" height="34" rx="17" fill="#fee2e2"/><text x="151" y="23" text-anchor="middle" class="label" fill="#b91c1c">High 72</text><rect x="211" width="112" height="34" rx="17" fill="#fef3c7"/><text x="267" y="23" text-anchor="middle" class="label" fill="#92400e">Medium 41</text><rect x="335" width="77" height="34" rx="17" fill="#e0f2fe"/><text x="373" y="23" text-anchor="middle" class="label" fill="#0369a1">Low 4</text></g>
    <rect x="613" y="552" width="374" height="132" rx="16" fill="#f0fdf4"/><text x="635" y="588" class="body" font-weight="800">결과 해석</text><text x="635" y="620" class="small">SBOM 구성요소와 CVE의 버전 매칭 결과이며,</text><text x="635" y="648" class="small">실제 사용 경로와 악용 조건을 추가 확인합니다.</text>

    <g filter="url(#shadow)"><rect x="1070" y="170" width="450" height="560" rx="26" fill="#fff"/><rect x="1070" y="170" width="450" height="12" rx="6" fill="#ea580c"/></g>
    <text x="1108" y="230" class="engine" fill="#c2410c">DAST</text><text x="1108" y="265" class="body">실행 중인 Staging 서비스 동적 검증</text><text x="1108" y="354" class="number">161</text><text x="1216" y="354" class="unit">엔드포인트</text><text x="1108" y="426" class="number">1,032</text><text x="1282" y="426" class="unit">평가 타깃</text>
    <g transform="translate(1108 478)"><rect width="178" height="50" rx="16" fill="#ffedd5"/><text x="22" y="34" class="miniNumber">4</text><text x="56" y="31" class="label" fill="#9a3412">재현 확인</text><rect x="194" width="178" height="50" rx="16" fill="#f1f5f9"/><text x="216" y="34" class="miniNumber">8</text><text x="250" y="31" class="label" fill="#475569">추가 검토</text></g>
    <rect x="1108" y="552" width="374" height="132" rx="16" fill="#fff7ed"/><text x="1130" y="588" class="body" font-weight="800">결과 해석</text><text x="1130" y="620" class="small">공격 요청과 대조 요청을 다시 실행해</text><text x="1130" y="648" class="small">동일한 차이가 재현되는지 확인합니다.</text>

    <g transform="translate(80 770)"><rect width="1440" height="180" rx="22" fill="#0f172a"/><text x="34" y="42" class="engine" font-size="24" fill="#fff">교차 검토로 확인한 것</text><circle cx="44" cy="78" r="5" fill="#60a5fa"/><text x="62" y="84" class="small" fill="#cbd5e1">SAST와 DAST가 함께 가리킨 보안 헤더·접근제어 이슈는</text><text x="62" y="110" class="small" fill="#cbd5e1">두 결과의 맥락을 대조해 판단 근거를 강화했습니다.</text><circle cx="746" cy="78" r="5" fill="#fb923c"/><text x="764" y="84" class="small" fill="#cbd5e1">배포 계층 CORS 설정과 빌드 번들 노출처럼</text><text x="764" y="110" class="small" fill="#cbd5e1">한 엔진이 보지 못하는 영역과 사각지대도 구분했습니다.</text><text x="34" y="150" class="small" fill="#94a3b8">※ 세 결과는 각각 코드 후보, 버전 매칭, 실행 재현을 의미하므로 확정 취약점 수로 합산하지 않습니다.</text></g>
  </g>
</svg>
