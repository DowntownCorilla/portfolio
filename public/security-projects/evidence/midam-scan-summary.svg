<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">미담 통합 보안점검 범위 및 결과 요약</title>
  <desc id="desc">SAST, SCA, DAST 점검 범위와 결과의 의미를 민감정보 없이 요약한 포트폴리오용 자료</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#163765" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17386b"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#f5f7fb"/>
  <rect x="0" y="0" width="1600" height="14" fill="url(#header)"/>

  <g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="92" y="92" font-size="22" font-weight="700" letter-spacing="5" fill="#2f6fd0">SECURITY SCAN REPORT</text>
    <text x="92" y="158" font-size="46" font-weight="800" fill="#17233a">통합 보안점검 범위 및 결과</text>
    <text x="92" y="203" font-size="23" fill="#637087">실제 코드와 Staging 환경에 SAST · SCA · DAST를 적용한 결과 요약</text>
    <line x1="92" y1="242" x2="1508" y2="242" stroke="#dce3ee" stroke-width="2"/>

    <g filter="url(#shadow)">
      <rect x="92" y="296" width="442" height="418" rx="24" fill="#ffffff"/>
      <rect x="579" y="296" width="442" height="418" rx="24" fill="#ffffff"/>
      <rect x="1066" y="296" width="442" height="418" rx="24" fill="#ffffff"/>
    </g>

    <g>
      <circle cx="148" cy="358" r="26" fill="#e9f0ff"/>
      <text x="148" y="367" text-anchor="middle" font-size="21" font-weight="800" fill="#2f6fd0">S</text>
      <text x="194" y="368" font-size="30" font-weight="800" fill="#17233a">SAST</text>
      <text x="148" y="426" font-size="18" font-weight="700" fill="#6f7c91">분석 범위</text>
      <text x="148" y="478" font-size="46" font-weight="800" fill="#17233a">846</text>
      <text x="262" y="477" font-size="23" fill="#637087">개 소스 파일</text>
      <line x1="148" y1="520" x2="478" y2="520" stroke="#e3e8f1"/>
      <text x="148" y="566" font-size="18" font-weight="700" fill="#6f7c91">분석 결과</text>
      <text x="148" y="620" font-size="46" font-weight="800" fill="#2f6fd0">31</text>
      <text x="220" y="619" font-size="23" fill="#637087">건의 검토 후보</text>
      <text x="148" y="671" font-size="18" fill="#8490a3">코드 구조와 규칙에 따른 후보</text>
    </g>

    <g>
      <circle cx="635" cy="358" r="26" fill="#e8f7f0"/>
      <text x="635" y="367" text-anchor="middle" font-size="21" font-weight="800" fill="#20845a">C</text>
      <text x="681" y="368" font-size="30" font-weight="800" fill="#17233a">SCA</text>
      <text x="635" y="426" font-size="18" font-weight="700" fill="#6f7c91">분석 범위</text>
      <text x="635" y="478" font-size="46" font-weight="800" fill="#17233a">428</text>
      <text x="749" y="477" font-size="23" fill="#637087">개 의존성</text>
      <line x1="635" y1="520" x2="965" y2="520" stroke="#e3e8f1"/>
      <text x="635" y="566" font-size="18" font-weight="700" fill="#6f7c91">분석 결과</text>
      <text x="635" y="620" font-size="46" font-weight="800" fill="#20845a">132</text>
      <text x="725" y="619" font-size="23" fill="#637087">건의 버전 매칭</text>
      <text x="635" y="671" font-size="18" fill="#8490a3">알려진 CVE와 의존성 버전 비교</text>
    </g>

    <g>
      <circle cx="1122" cy="358" r="26" fill="#fff2e6"/>
      <text x="1122" y="367" text-anchor="middle" font-size="21" font-weight="800" fill="#cc641f">D</text>
      <text x="1168" y="368" font-size="30" font-weight="800" fill="#17233a">DAST</text>
      <text x="1122" y="426" font-size="18" font-weight="700" fill="#6f7c91">검증 범위</text>
      <text x="1122" y="478" font-size="46" font-weight="800" fill="#17233a">161</text>
      <text x="1210" y="477" font-size="23" fill="#637087">개 엔드포인트</text>
      <text x="1122" y="518" font-size="20" fill="#8490a3">1,032개 평가 타깃</text>
      <line x1="1122" y1="546" x2="1452" y2="546" stroke="#e3e8f1"/>
      <text x="1122" y="592" font-size="18" font-weight="700" fill="#6f7c91">재현 검증 결과</text>
      <text x="1122" y="646" font-size="42" font-weight="800" fill="#cc641f">4</text>
      <text x="1154" y="645" font-size="22" fill="#637087">건 확인</text>
      <text x="1270" y="646" font-size="42" font-weight="800" fill="#7d8799">8</text>
      <text x="1302" y="645" font-size="22" fill="#637087">건 추가 검토</text>
      <text x="1122" y="688" font-size="18" fill="#8490a3">Staging 환경에서 재현 여부를 분리</text>
    </g>

    <rect x="92" y="774" width="1416" height="136" rx="20" fill="#eaf0f9"/>
    <text x="130" y="824" font-size="20" font-weight="800" fill="#234c85">결과 해석 기준</text>
    <text x="130" y="864" font-size="20" fill="#41516b">SAST는 코드 검토 후보, SCA는 버전 매칭 결과이며 모두 확정 취약점 수로 합산하지 않습니다.</text>
    <text x="130" y="898" font-size="20" fill="#41516b">DAST는 운영과 분리된 Staging 환경에서 재현 확인 항목과 추가 검토 항목을 구분했습니다.</text>
  </g>
</svg>
