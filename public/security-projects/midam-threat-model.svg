<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">미담 공예 커머스 Level 0 위협 모델링</title>
  <desc id="desc">구매자, 장인, 관리자에서 서비스, 애플리케이션, 데이터 저장소와 외부 서비스로 이어지는 F-01부터 F-17까지의 데이터 흐름과 신뢰 경계</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.kr{font-family:Pretendard,'Noto Sans KR',Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#0f172a}.sub{font-size:16px;fill:#475569}.tb{font-size:15px;font-weight:800}.boxTitle{font-size:18px;font-weight:750;fill:#0f172a}.boxSub{font-size:14px;fill:#475569}.flow{font-size:12px;font-weight:700;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.primary{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.return{fill:none;stroke:#7c3aed;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="62" class="kr title">미담 공예 커머스 위협 모델링 — Level 0 DFD</text>
  <text x="70" y="92" class="kr sub">행위자·서비스·데이터·외부 연동을 6개 신뢰 경계로 구분하고 주요 요청 흐름을 F-01~F-17로 식별</text>

  <rect x="55" y="125" width="240" height="690" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="75" y="155" class="kr tb" fill="#c2410c">TB-01  인터넷 / 비신뢰 영역</text>
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="190" height="82" rx="12" fill="white" stroke="#fed7aa"/><text x="175" y="224" text-anchor="middle" class="kr boxTitle">비회원·공격자</text><text x="175" y="249" text-anchor="middle" class="kr boxSub">공개 조회 / 비정상 요청</text>
    <rect x="80" y="310" width="190" height="82" rx="12" fill="white" stroke="#fed7aa"/><text x="175" y="344" text-anchor="middle" class="kr boxTitle">구매자</text><text x="175" y="369" text-anchor="middle" class="kr boxSub">로그인·주문·배송</text>
    <rect x="80" y="430" width="190" height="82" rx="12" fill="white" stroke="#fed7aa"/><text x="175" y="464" text-anchor="middle" class="kr boxTitle">장인</text><text x="175" y="489" text-anchor="middle" class="kr boxSub">상품·주문·정산</text>
    <rect x="80" y="550" width="190" height="82" rx="12" fill="white" stroke="#fed7aa"/><text x="175" y="584" text-anchor="middle" class="kr boxTitle">관리자</text><text x="175" y="609" text-anchor="middle" class="kr boxSub">운영·승인·정산 관리</text>
  </g>

  <rect x="325" y="125" width="260" height="690" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="345" y="155" class="kr tb" fill="#1d4ed8">TB-02  공개 서비스</text>
  <g filter="url(#shadow)">
    <rect x="350" y="220" width="210" height="92" rx="12" fill="white" stroke="#bfdbfe"/><text x="455" y="255" text-anchor="middle" class="kr boxTitle">WAF · Rate Limit</text><text x="455" y="281" text-anchor="middle" class="kr boxSub">외부 요청의 첫 통제 지점</text>
    <rect x="350" y="365" width="210" height="92" rx="12" fill="white" stroke="#bfdbfe"/><text x="455" y="400" text-anchor="middle" class="kr boxTitle">구매자·장인 Web/API</text><text x="455" y="426" text-anchor="middle" class="kr boxSub">인증 후 서비스 요청</text>
    <rect x="350" y="530" width="210" height="92" rx="12" fill="white" stroke="#bfdbfe"/><text x="455" y="565" text-anchor="middle" class="kr boxTitle">관리자 인증·콘솔</text><text x="455" y="591" text-anchor="middle" class="kr boxSub">고권한 업무 진입점</text>
  </g>

  <rect x="615" y="125" width="290" height="690" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="635" y="155" class="kr tb" fill="#15803d">TB-03  애플리케이션</text>
  <g filter="url(#shadow)">
    <rect x="640" y="205" width="240" height="122" rx="12" fill="white" stroke="#bbf7d0"/><text x="760" y="241" text-anchor="middle" class="kr boxTitle">핵심 업무 서비스</text><text x="760" y="269" text-anchor="middle" class="kr boxSub">인증 · 상품 · 주문</text><text x="760" y="294" text-anchor="middle" class="kr boxSub">결제 · 정산</text>
    <rect x="640" y="390" width="240" height="88" rx="12" fill="white" stroke="#bbf7d0"/><text x="760" y="426" text-anchor="middle" class="kr boxTitle">파일 처리</text><text x="760" y="452" text-anchor="middle" class="kr boxSub">업로드 검사·저장</text>
    <rect x="640" y="550" width="240" height="88" rx="12" fill="white" stroke="#bbf7d0"/><text x="760" y="586" text-anchor="middle" class="kr boxTitle">감사 로그·탐지</text><text x="760" y="612" text-anchor="middle" class="kr boxSub">행위 기록·이상징후</text>
  </g>

  <rect x="935" y="125" width="275" height="690" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="955" y="155" class="kr tb" fill="#7e22ce">TB-04  데이터 / 비밀정보</text>
  <g filter="url(#shadow)">
    <rect x="960" y="215" width="225" height="96" rx="12" fill="white" stroke="#e9d5ff"/><text x="1072" y="251" text-anchor="middle" class="kr boxTitle">회원·주문·정산 DB</text><text x="1072" y="278" text-anchor="middle" class="kr boxSub">개인정보·거래정보</text>
    <rect x="960" y="390" width="225" height="88" rx="12" fill="white" stroke="#e9d5ff"/><text x="1072" y="426" text-anchor="middle" class="kr boxTitle">Object Storage</text><text x="1072" y="452" text-anchor="middle" class="kr boxSub">상품·증빙 파일</text>
    <rect x="960" y="550" width="225" height="88" rx="12" fill="white" stroke="#e9d5ff"/><text x="1072" y="586" text-anchor="middle" class="kr boxTitle">Secret / KMS</text><text x="1072" y="612" text-anchor="middle" class="kr boxSub">키·토큰·접속정보</text>
  </g>

  <rect x="1240" y="125" width="305" height="455" rx="18" fill="#fefce8" stroke="#facc15" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1260" y="155" class="kr tb" fill="#a16207">TB-05  외부 서비스</text>
  <g filter="url(#shadow)">
    <rect x="1265" y="190" width="255" height="78" rx="12" fill="white" stroke="#fde68a"/><text x="1392" y="222" text-anchor="middle" class="kr boxTitle">OAuth / 본인확인</text><text x="1392" y="246" text-anchor="middle" class="kr boxSub">외부 인증</text>
    <rect x="1265" y="305" width="255" height="78" rx="12" fill="white" stroke="#fde68a"/><text x="1392" y="337" text-anchor="middle" class="kr boxTitle">PG 결제</text><text x="1392" y="361" text-anchor="middle" class="kr boxSub">결제 생성·검증·Webhook</text>
    <rect x="1265" y="420" width="255" height="78" rx="12" fill="white" stroke="#fde68a"/><text x="1392" y="452" text-anchor="middle" class="kr boxTitle">배송 / 알림</text><text x="1392" y="476" text-anchor="middle" class="kr boxSub">배송사·메시지 전송</text>
  </g>

  <rect x="1240" y="610" width="305" height="205" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1260" y="640" class="kr tb" fill="#334155">TB-06  개발 / 배포</text>
  <rect x="1265" y="670" width="255" height="92" rx="12" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/><text x="1392" y="706" text-anchor="middle" class="kr boxTitle">Source Repo · CI/CD</text><text x="1392" y="733" text-anchor="middle" class="kr boxSub">승인 코드·배포 파이프라인</text>

  <path d="M270 231H350" class="line"/><text x="310" y="220" text-anchor="middle" class="kr flow">F-03</text>
  <path d="M270 351H350" class="primary"/><text x="310" y="340" text-anchor="middle" class="kr flow">F-01</text>
  <path d="M270 471H350" class="primary"/><text x="310" y="460" text-anchor="middle" class="kr flow">F-02</text>
  <path d="M270 591H350" class="line"/><text x="310" y="580" text-anchor="middle" class="kr flow">F-04</text>
  <path d="M455 312V365" class="primary"/><text x="470" y="344" class="kr flow">F-05</text>
  <path d="M560 411C600 411 600 266 640 266" class="primary"/><text x="594" y="349" class="kr flow">F-06</text>
  <path d="M560 576C610 576 596 300 640 300" class="line"/><text x="590" y="485" class="kr flow">F-07</text>
  <path d="M880 250H960" class="primary"/><text x="920" y="239" text-anchor="middle" class="kr flow">F-08</text>
  <path d="M880 433H960" class="line"/><text x="920" y="422" text-anchor="middle" class="kr flow">F-09</text>
  <path d="M880 282C930 282 912 594 960 594" class="line"/><text x="918" y="527" class="kr flow">F-10</text>
  <path d="M760 327V550" class="line"/><text x="775" y="510" class="kr flow">F-11</text>
  <path d="M560 388C910 110 1110 180 1265 229" class="line"/><text x="1035" y="176" class="kr flow">F-12</text>
  <path d="M880 266C1060 266 1090 344 1265 344" class="primary"/><text x="1087" y="317" class="kr flow">F-13</text>
  <path d="M1265 371C1085 395 1050 305 880 305" class="return"/><text x="1080" y="383" class="kr flow">F-14 Webhook</text>
  <path d="M880 290C1040 340 1095 459 1265 459" class="line"/><text x="1082" y="448" class="kr flow">F-15</text>
  <path d="M1265 702C1080 690 1030 325 880 325" class="line"/><text x="1065" y="677" class="kr flow">F-16</text>
  <path d="M1265 738C1188 738 1212 594 1185 594" class="line"/><text x="1223" y="686" class="kr flow">F-17</text>

  <rect x="55" y="838" width="1490" height="40" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="82" cy="858" r="6" fill="#dc2626"/><text x="98" y="864" class="kr sub"><tspan font-weight="800" fill="#991b1b">P0 우선 검토:</tspan> 관리자·장인 계정 탈취 · IDOR/BOLA · 정산계좌 탈취 · 주문/결제 위변조</text>
  <circle cx="930" cy="858" r="6" fill="#f59e0b"/><text x="946" y="864" class="kr sub"><tspan font-weight="800" fill="#92400e">P1:</tspan> 봇·대량요청·서비스 거부</text>
</svg>
