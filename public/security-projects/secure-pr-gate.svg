<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Secure PR Gate DevSecOps workflow</title>
  <desc id="desc">Pull request and post-merge security checks produce policy decisions and remediation guidance.</desc>
  <rect width="1280" height="720" fill="#050505"/>
  <g stroke="#c9a77c" fill="none" stroke-width="3">
    <rect x="70" y="80" width="1140" height="560" rx="8" opacity=".45"/>
    <rect x="105" y="270" width="175" height="130" rx="6"/>
    <rect x="355" y="135" width="190" height="105" rx="6"/>
    <rect x="355" y="305" width="190" height="105" rx="6"/>
    <rect x="355" y="475" width="190" height="105" rx="6"/>
    <rect x="650" y="270" width="210" height="130" rx="6"/>
    <rect x="950" y="220" width="215" height="230" rx="6"/>
    <path d="M280 335h50m215-145h55v145h50m-105 23h105m-105 170h55V378h50m210-43h90"/>
  </g>
  <g fill="#c9a77c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="640" y="55" font-size="22" letter-spacing="5">DEVSECOPS / POLICY AS CODE</text>
    <text x="192" y="330" font-size="30">PR</text><text x="192" y="365" font-size="16" opacity=".7">OR DEPLOY</text>
    <text x="450" y="195" font-size="27">SAST</text><text x="450" y="220" font-size="14" opacity=".7">SOURCE</text>
    <text x="450" y="365" font-size="27">SCA</text><text x="450" y="390" font-size="14" opacity=".7">DEPENDENCY</text>
    <text x="450" y="535" font-size="27">DAST</text><text x="450" y="560" font-size="14" opacity=".7">STAGING</text>
    <text x="755" y="330" font-size="26">POLICY</text><text x="755" y="365" font-size="15" opacity=".7">NORMALIZE</text>
    <text x="1057" y="290" font-size="25">BLOCK</text><text x="1057" y="335" font-size="25">WARN</text><text x="1057" y="380" font-size="25">PASS</text><text x="1057" y="420" font-size="14" opacity=".7">PR COMMENT</text>
  </g>
</svg>
