<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">원클릭 보안점검 SaaS 전체 아키텍처</title>
  <desc id="desc">GitHub App으로 소스를 수집하고 자체 SAST, SCA, DAST 엔진으로 분석한 뒤 결과를 교차 검토해 보고서로 제공하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2937" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0l10 6-10 6z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#0f172a}.subtitle{font-size:20px;font-weight:500;fill:#475569}.section{font-size:18px;font-weight:800;letter-spacing:2px;fill:#64748b}.head{font-size:24px;font-weight:800;fill:#0f172a}.body{font-size:17px;font-weight:500;fill:#475569}.small{font-size:15px;font-weight:600;fill:#64748b}.tag{font-size:14px;font-weight:800}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1450" cy="110" r="250" fill="#dbeafe" opacity=".55"/><circle cx="130" cy="900" r="240" fill="#dcfce7" opacity=".45"/>
  <g class="sans">
    <text x="80" y="82" class="title">원클릭 보안점검 SaaS</text>
    <text x="80" y="120" class="subtitle">GitHub 연결부터 정적·의존성·동적 분석, 교차 검토와 보고서까지</text>
    <g transform="translate(80 160)"><rect width="220" height="58" rx="29" fill="#fff" stroke="#cbd5e1"/><circle cx="28" cy="29" r="8" fill="#16a34a"/><text x="48" y="36" class="small" fill="#166534">구현 및 실제 환경 검증</text><path d="M244 29h56" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/><text x="316" y="36" class="small">제품 연동·운영 배포 진행</text></g>

    <text x="80" y="280" class="section">01 · ENTRY &amp; SOURCE ACCESS</text>
    <g filter="url(#shadow)"><rect x="80" y="305" width="310" height="188" rx="22" fill="#fff"/><rect x="80" y="305" width="10" height="188" rx="5" fill="#2563eb"/></g>
    <text x="115" y="352" class="head">Web Console</text><text x="115" y="382" class="body">Next.js 사용자 화면</text><text x="115" y="418" class="small">• GitHub App 설치 및 저장소 선택</text><text x="115" y="447" class="small">• 점검 요청과 결과 확인</text><rect x="115" y="462" width="116" height="25" rx="12" fill="#dbeafe"/><text x="173" y="480" text-anchor="middle" class="tag" fill="#1d4ed8">초기 배포 완료</text>
    <g filter="url(#shadow)"><rect x="435" y="305" width="350" height="188" rx="22" fill="#fff"/><rect x="435" y="305" width="10" height="188" rx="5" fill="#475569"/></g>
    <text x="470" y="352" class="head">GitHub App · Source Intake</text><text x="470" y="382" class="body">읽기 권한으로 비공개 저장소 수집</text><text x="470" y="418" class="small">• Installation Token 발급</text><text x="470" y="447" class="small">• Tarball 1회 다운로드 및 격리 해제</text><text x="470" y="476" class="small">• 엔진별 동일 소스 스냅샷 전달</text><path d="M390 399h33" class="flow"/>

    <text x="835" y="280" class="section">02 · SECURITY ENGINES</text>
    <g filter="url(#shadow)"><rect x="835" y="305" width="685" height="188" rx="22" fill="#fff"/></g>
    <g transform="translate(865 330)"><rect width="195" height="136" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="20" y="34" class="head" fill="#1e3a8a">SAST</text><text x="20" y="63" class="small">tree-sitter AST</text><text x="20" y="88" class="small">Pattern + Taint</text><text x="20" y="113" class="small">JS/TS · Java · Python</text></g>
    <g transform="translate(1080 330)"><rect width="195" height="136" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="20" y="34" class="head" fill="#14532d">SCA</text><text x="20" y="63" class="small">Trivy · CycloneDX</text><text x="20" y="88" class="small">SBOM + CVE</text><text x="20" y="113" class="small">Gradle 격리 폴백</text></g>
    <g transform="translate(1295 330)"><rect width="195" height="136" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="20" y="34" class="head" fill="#7c2d12">DAST</text><text x="20" y="63" class="small">LLM · rever-browser</text><text x="20" y="88" class="small">Tier1 + Tier2</text><text x="20" y="113" class="small">대조 요청 재현</text></g><path d="M785 399h38" class="flow"/>

    <text x="80" y="574" class="section">03 · DAST DISCOVERY &amp; VERIFICATION</text>
    <g filter="url(#shadow)"><rect x="80" y="600" width="980" height="190" rx="22" fill="#fff"/></g>
    <g transform="translate(110 628)"><rect width="270" height="132" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="20" y="34" class="head">URL 독립 진단</text><text x="20" y="66" class="small">브라우저 조작과 네트워크 요청 수집</text><text x="20" y="95" class="small">화면 밖 동작까지 LLM이 탐색</text><rect x="20" y="105" width="86" height="22" rx="11" fill="#dcfce7"/><text x="63" y="121" text-anchor="middle" class="tag" fill="#166534">구현 완료</text></g>
    <g transform="translate(405 628)"><rect width="280" height="132" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="8 7"/><text x="20" y="34" class="head">소스 연계 진단</text><text x="20" y="66" class="small">AST 엔드포인트 후보 결합</text><text x="20" y="95" class="small">SAST 결과와 상호 재검토</text><rect x="20" y="105" width="118" height="22" rx="11" fill="#e2e8f0"/><text x="79" y="121" text-anchor="middle" class="tag" fill="#475569">제품 연동 진행</text></g>
    <g transform="translate(710 628)"><rect width="320" height="132" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="20" y="34" class="head">검증 파이프라인</text><text x="20" y="64" class="small">정규화 → Playbook → Tier1</text><text x="20" y="89" class="small">Tier2 → 공격/대조 요청 재실행</text><text x="20" y="114" class="small">재현 확인 → Finding 생성</text></g><path d="M380 694h13" class="flow"/><path d="M685 694h13" class="flow"/>

    <text x="1110" y="574" class="section">04 · RESULT DELIVERY</text>
    <g filter="url(#shadow)"><rect x="1110" y="600" width="410" height="190" rx="22" fill="#fff"/><rect x="1110" y="600" width="10" height="190" rx="5" fill="#7c3aed"/></g>
    <text x="1145" y="646" class="head">결과 통합 및 보고서</text><text x="1145" y="680" class="small">• 엔진별 결과 의미를 구분해 정리</text><text x="1145" y="709" class="small">• 상호 일치·사각지대 교차 검토</text><text x="1145" y="738" class="small">• 근거와 재현 조건 중심으로 전달</text><rect x="1145" y="752" width="180" height="25" rx="12" fill="#ede9fe"/><text x="1235" y="770" text-anchor="middle" class="tag" fill="#6d28d9">실제 환경 보고서 생성</text><path d="M1060 695h38" class="flow"/><path d="M1178 493v62h137v33" class="flow"/>

    <g transform="translate(80 852)"><rect width="1440" height="90" rx="20" fill="#0f172a"/><text x="34" y="38" class="head" fill="#fff">현재 상태</text><text x="178" y="38" class="body" fill="#cbd5e1">자체 SAST·SCA·DAST와 보고서 생성 경로 구현 · 실제 커머스 코드와 Staging 환경 검증 완료</text><text x="178" y="68" class="body" fill="#94a3b8">웹 제품 연동, 소스 연계 자동 실행과 온디맨드 운영 배포는 계속 고도화 중</text></g>
  </g>
</svg>
