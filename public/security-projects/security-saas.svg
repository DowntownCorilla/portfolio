<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">One-click security scanning SaaS architecture</title>
  <desc id="desc">GitHub source flows through SAST, SCA, and DAST engines into verified findings.</desc>
  <rect width="1280" height="720" fill="#050505"/>
  <g stroke="#c9a77c" fill="none" stroke-width="3">
    <rect x="70" y="80" width="1140" height="560" rx="8" opacity=".45"/>
    <rect x="115" y="275" width="210" height="130" rx="6"/>
    <rect x="430" y="135" width="210" height="105" rx="6"/>
    <rect x="430" y="305" width="210" height="105" rx="6"/>
    <rect x="430" y="475" width="210" height="105" rx="6"/>
    <rect x="760" y="275" width="210" height="130" rx="6"/>
    <rect x="1040" y="275" width="125" height="130" rx="6"/>
    <path d="M325 340h80m235-150h70v150h50m-120 18h120m-120 170h70V376h50m210-36h70"/>
  </g>
  <g fill="#c9a77c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="640" y="55" font-size="22" letter-spacing="5">SECURITY PIPELINE / IN PROGRESS</text>
    <text x="220" y="330" font-size="30">GITHUB APP</text><text x="220" y="365" font-size="17" opacity=".7">SOURCE INTAKE</text>
    <text x="535" y="195" font-size="30">SAST</text><text x="535" y="220" font-size="15" opacity=".7">PATTERN + TAINT</text>
    <text x="535" y="365" font-size="30">SCA</text><text x="535" y="390" font-size="15" opacity=".7">SBOM + CVE</text>
    <text x="535" y="535" font-size="30">DAST</text><text x="535" y="560" font-size="15" opacity=".7">AGENT + REPLAY</text>
    <text x="865" y="330" font-size="27">VERIFY</text><text x="865" y="365" font-size="16" opacity=".7">CROSS-CHECK</text>
    <text x="1102" y="330" font-size="23">FINDING</text><text x="1102" y="365" font-size="15" opacity=".7">EVIDENCE</text>
  </g>
</svg>
