# Secure PR Gate caller — PR soft-profile test only.

name: Secure PR Gate

on:
  pull_request:
    branches:
      - main
      - develop
  # 테스트 브랜치 push로 Actions 파이프라인 스모크
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  secure-pr-gate:
    uses: KT-TECHUP-PROJECT5/secure_gate/.github/workflows/pr-security-gate.yml@main
    with:
      gate_repository: KT-TECHUP-PROJECT5/secure_gate
      gate_ref: main
      # Next.js runner-local DAST
      enable_dast: true
      install_command: npm ci
      build_command: npm run build
      start_command: npm start
      app_port: "3000"
      health_path: /
      node_version: "20"
      # Dockerfile 없음 → Trivy fs + CycloneDX SBOM
      # DT secrets 없으면 업로드만 skip (SBOM artifact는 유지)
      dependency_track_upload_mode: never
